[package]
name = "ciso-smb-scan"
version = "0.1.0"
edition = "2021"
description = "Fast SMB/CIFS file-share content scanner for CISO Toolbox Surface (Rust worker)."
license = "MIT"

[[bin]]
name = "ciso-smb-scan"
path = "src/main.rs"

[dependencies]
pavao = "0.2"                       # SMB/CIFS via libsmbclient
regex = "1"                        # secret ruleset
serde = { version = "1", features = ["derive"] }
serde_json = "1"                   # findings IPC + config
zip = "9.0.5"                      # docx/pptx/xlsx are ZIP containers
quick-xml = "0.42"                 # extract text from office XML parts
calamine = "0.37"                  # xlsx cell values

[profile.release]
opt-level = 3
lto = true
strip = true
