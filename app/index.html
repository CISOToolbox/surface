<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surface - CISO Toolbox</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/cisotoolbox.css">
<link rel="stylesheet" href="css/Surface.css">
</head>
<body>

<div class="ct-app">
<header class="ct-appbar">
    <button class="btn-hamburger" data-click="_toggleSidebarMobile">&#9776;</button>
    <span class="ct-modulepicker" role="img" aria-label="Surface"><span data-i18n="module.surface">Surface</span></span>
    <span class="ct-appbar-sep"></span>
    <nav class="ct-appbar-context" aria-label="Contexte"><span class="ct-muted" id="header-subtitle"></span></nav>
<!-- Menu Fichier désactivé : fonctions locales (ouvrir/enregistrer/imports) pas encore branchées en mode suite — réactiver en décommentant. -->
<!--     <div class="toolbar-menu">
        <button class="ct-btn" data-size="sm" data-click="toggleMenu"><span data-i18n="menu_file">Fichier</span></button>
        <div class="toolbar-dropdown" id="io-menu">
            <div class="toolbar-dropdown-item" data-click="_menuAction" data-args='["importHosts"]' data-i18n="menu.import_hosts">Importer hôtes</div>
            <div class="toolbar-dropdown-item" data-click="_menuAction" data-args='["exportReport"]' data-i18n="menu.export_report">Exporter rapport</div>
        </div>
    </div> -->
    <span class="ct-spacer"></span>
    <span class="ct-appbar-saved" id="status-msg"></span>
    <div class="ct-appbar-actions">
        <button class="ct-iconaction" data-click="ct_toggleLang" data-icon="globe" aria-label="Langue" title="Langue FR / EN"></button>
        <button class="ct-iconaction" data-click="ct_toggleTheme" data-icon="moon" aria-label="Thème" title="Thème clair / sombre"></button>
        <span class="ct-toolbar-right" id="toolbar-right"></span>
    </div>
</header>

<div class="ct-body">

<nav class="ct-rail" id="sidebar" aria-label="Navigation du module">
  <div class="ct-rail-scroll">
    <div class="ct-rail-section">
      <button class="ct-rail-group" aria-expanded="true" data-click="ct_toggleRailGroup" data-pass-el>
        <span class="ct-icon-btn-slot" data-icon="chevron-right"></span><span>SURFACE</span>
      </button>
      <button class="ct-rail-item" aria-current="page" data-click="selectPanel" data-args='["dashboard"]'><span class="ct-rail-item-label" data-i18n="nav.dashboard">Tableau de bord</span></button>
      <button class="ct-rail-item" data-click="selectPanel" data-args='["monitored"]'><span class="ct-rail-item-label" data-i18n="nav.monitored">Surveillance</span></button>
      <button class="ct-rail-item" data-click="selectPanel" data-args='["hosts"]'><span class="ct-rail-item-label" data-i18n="nav.hosts">Hosts</span></button>
      <button class="ct-rail-item" data-click="selectPanel" data-args='["jobs"]'><span class="ct-rail-item-label" data-i18n="nav.jobs">Scans</span></button>
      <button class="ct-rail-item" data-click="selectPanel" data-args='["findings"]'><span class="ct-rail-item-label" data-i18n="nav.findings">Findings</span></button>
      <button class="ct-rail-item" data-click="selectPanel" data-args='["measures"]'><span class="ct-rail-item-label" data-i18n="nav.measures">Mesures</span></button>
    </div>

    <div class="ct-rail-section">
      <button class="ct-rail-group" aria-expanded="true" data-click="ct_toggleRailGroup" data-pass-el>
        <span class="ct-icon-btn-slot" data-icon="chevron-right"></span><span>Administration</span>
      </button>
      <button class="ct-rail-item ct-admin-only" data-click="selectPanel" data-args='["audit"]'><span class="ct-rail-item-label" data-i18n="nav.audit">Journal d'audit</span></button>
    </div>

    <div class="ct-rail-section">
      <button class="ct-rail-group" aria-expanded="true" data-click="ct_toggleRailGroup" data-pass-el>
        <span class="ct-icon-btn-slot" data-icon="chevron-right"></span><span data-i18n="nav.help_section">AIDE</span>
      </button>
      <button class="ct-rail-item" data-click="toggleHelp" data-args='["methodo"]'><span class="ct-rail-item-label" data-i18n="nav.help_methodo">Methodologie</span></button>
      <button class="ct-rail-item" data-click="toggleHelp" data-args='["usage"]'><span class="ct-rail-item-label" data-i18n="nav.help_usage">Utilisation</span></button>
    </div>
  </div>

  <div class="ct-rail-foot">
    <a href="https://www.cisotoolbox.org" target="_blank" rel="noopener noreferrer" class="sidebar-brand">cisotoolbox.org</a>
  </div>
</nav>

<!-- ════════════════ Help overlay ════════════════ -->
<div class="help-overlay" id="help-overlay" data-click-self="toggleHelp">
<div class="help-panel">
<button class="close-help" data-click="toggleHelp" aria-label="close">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
</button>

<div class="help-tabs">
    <div class="help-tab active" id="help-tab-methodo" data-click="switchHelpTab" data-args='["methodo"]' data-i18n="help.tab_methodo">Methodologie ASM</div>
    <div class="help-tab" id="help-tab-usage" data-click="switchHelpTab" data-args='["usage"]' data-i18n="help.tab_usage">Utilisation</div>
</div>

<!-- ════════ Onglet Methodologie ════════ -->
<div class="help-content" id="help-content-methodo" data-i18n-html="help.methodo_html"></div>

<!-- ════════ Onglet Utilisation ════════ -->
<div class="help-content ct-hidden" id="help-content-usage" data-i18n-html="help.usage_html"></div>

</div>
</div>

<main class="ct-content" id="content"></main>
</div><!-- ct-body -->
</div><!-- ct-app -->

<input type="file" id="file-input" accept=".json" class="ct-hidden">

<script src="js/Surface_config.js"></script>
<script src="js/cisotoolbox.js"></script>
<script src="js/ct_modules.js"></script>
<script src="js/cisotoolbox_backend.js"></script>
<script src="js/i18n.js"></script>
<script src="js/i18n_core_en.js"></script>
<script src="js/i18n_core_fr.js"></script>
<script src="js/ct_findings.js"></script>
<script src="js/ct_audit.js"></script>
<script src="js/ct_modal.js"></script>
<script src="js/ct_notifprefs.js"></script>
<script src="js/ct_userpicker.js"></script>
<script src="js/ct_measure_modal.js"></script>
<script src="js/ct_table.js"></script>
<script src="js/ct_bulkbar.js"></script>
<script src="js/ct_finding_view.js"></script>
<script src="js/Surface_i18n_fr.js"></script>
<script src="js/Surface_i18n_en.js"></script>
<script src="js/surface_api.js"></script>
<script src="js/Surface_app.js"></script>
<script src="js/ai_common.js"></script>
<script src="js/ct_settings.js"></script>
<script src="js/ai_backend.js"></script>

</body>
</html>
